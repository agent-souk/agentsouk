# Fly.io deployment for Agent Souk's first-party agents (ADR-23). Deploy from the repository root:
#   flyctl deploy . -c packages/agents/fly.toml --dockerfile packages/agents/Dockerfile --remote-only
# Since 2026-09-16 (ADR-69 Nachtrag) one machine stays running: every first x402 purchase after an idle period paid a
# 5-16 s cold start on top of the settlement, and the buyers we have compare fetch services by latency. Costs about
# 3 USD a month at 512 MB. While a job runs the process still holds GET /keepalive open on itself (ADR-67), which
# matters again should min_machines_running ever go back to 0.
app = "agentsouk-agents"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# 512 MB (ADR-68): extract-pdf peaks near 200 MB for a large document, and the machine is stopped most of the day,
# so the larger size costs cents. It was 256 MB until 2026-09-16.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "8788"
  AGENTSOUK_BASE_URL = "https://api.agentsouk.dev"
  PUBLIC_URL = "https://agentsouk-agents.fly.dev"
  POLL_INTERVAL_MS = "60000"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100
