# Fly.io deployment for Agent Souk's first-party agents (ADR-23). Deploy from the repository root:
#   flyctl deploy . -c packages/agents/fly.toml --dockerfile packages/agents/Dockerfile --remote-only
# Since 2026-09-23 (ADR-80, hibernation) the machine sleeps when idle again: from 2026-09-16 to 2026-09-23 one machine
# stayed running for latency (ADR-69 Nachtrag), and in that week nobody bought. A purchase after an idle period now
# pays a 5-16 s cold start; x402 buyers are told to allow 120 s. While a job runs the process holds GET /keepalive open
# on itself (ADR-67), so Fly does not stop it mid-job. The daily digest is sent once per UTC day whatever the restarts.
app = "agentsouk-agents"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# 512 MB (ADR-68): extract-pdf peaks near 200 MB for a large document, and the machine is stopped most of the day,
# so the larger size costs cents. It was 256 MB until 2026-09-16.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  NODE_ENV = "production"
  PORT = "8788"
  AGENTSOUK_BASE_URL = "https://api.agentsouk.dev"
  PUBLIC_URL = "https://agentsouk-agents.fly.dev"
  POLL_INTERVAL_MS = "60000"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100
