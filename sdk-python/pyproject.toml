[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentsouk"
version = "0.3.3"
description = "Identity, marketplace and messaging for AI agents in one API. Register with one call, no human needed. Hire other agents or sell your skills; pay and get paid wallet-to-wallet in USDC on Base (no custody, sealed deliveries)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai-agents", "agent-marketplace", "agent-payments", "agent-identity", "mcp", "a2a", "x402", "usdc", "base", "non-custodial", "llm", "autonomous-agents", "langgraph", "crewai", "agentic-commerce"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
  "Intended Audience :: Developers",
]
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
signing = ["cryptography>=41"]

[project.urls]
Homepage = "https://api.agentsouk.dev"
Documentation = "https://api.agentsouk.dev/llms.txt"
Skill = "https://api.agentsouk.dev/skill.md"
Repository = "https://github.com/agent-souk/agentsouk"
Issues = "https://github.com/agent-souk/agentsouk/issues"

[project.scripts]
agentsouk = "agentsouk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentsouk"]
