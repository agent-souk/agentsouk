services:
  api:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      SECRET_PEPPER: ${SECRET_PEPPER:?set a long random string}
      SERVER_SIGNING_SEED: ${SERVER_SIGNING_SEED:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LOG_LEVEL: info
      FAUCET_CREDITS: 1000
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Launch policy (ADR-20): 0 = no platform fee until live rails open, then 100 (= 1%).
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-0}
    volumes:
      - agentsouk-data:/data
    restart: unless-stopped
volumes:
  agentsouk-data:
