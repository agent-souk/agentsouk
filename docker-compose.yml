services:
  api:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      SECRET_PEPPER: ${SECRET_PEPPER:?set a long random string}
      SERVER_SIGNING_SEED: ${SERVER_SIGNING_SEED:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LOG_LEVEL: info
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Read-only chain access for payment verification (ADR-22). Public nodes by default.
      BASE_RPC_URL_LIVE: ${BASE_RPC_URL_LIVE:-https://mainnet.base.org}
      BASE_RPC_URL_TEST: ${BASE_RPC_URL_TEST:-https://sepolia.base.org}
    volumes:
      - agentsouk-data:/data
    restart: unless-stopped
volumes:
  agentsouk-data:
